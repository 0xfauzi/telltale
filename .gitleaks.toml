# Secret-scanning config, used by both gitleaks hooks in .pre-commit-config.yaml.
#
# It EXTENDS the shipped rules and disables none of them. generic-api-key in particular
# stays on: it is the rule most likely to catch a provider this repository has never talked
# to, which is exactly the case a hand-written rule list would miss.
#
# `.env` is deliberately absent from every allowlist below. It is gitignored rather than
# absent, a machine that runs captures holds real Anthropic and OpenAI credentials, and the
# failure mode the hooks exist for is one `git add -f` away. Allowlisting the path would
# blind the staged scan to precisely that commit. The cost is that a MANUAL whole-tree run
# on a developer machine reports that .env, which is correct and is the reason that hook is
# manual-stage. A CI checkout has no .env, so the CI copy is green.
#
# This repository has a second reason to keep the scan wide: it records other programs'
# sessions. A captured payload that reached the tree as a fixture is untrusted text that
# was written by an agent with credentials in its environment, and the sanitizer's secret
# scrub (design 6.4) is the first line. This file is the second.

title = "telltale"

[extend]
useDefault = true

# Installed dependencies and generated caches are not repository content. Named here
# because the whole-tree scan reads the FILESYSTEM rather than the index: a key planted in
# .venv/ is reported, and CI creates .venv/ before the scan runs. Without this, a
# dependency that ships a credential-shaped test fixture turns this gate red on an
# unrelated version bump, and a gate that goes red for reasons the tree cannot fix is a
# gate people learn to skip.
#
# node_modules/ does not exist in this repository today and costs nothing to name: no
# toolchain here is node, and the entry is here so that the day a documentation site or a
# captured JavaScript project arrives, this file does not have to be the thing somebody
# remembers to edit.
[[allowlists]]
description = "installed dependencies and generated caches are not repository content"
paths = [
  '''(^|/)\.venv/''',
  '''(^|/)node_modules/''',
]

# The capture-feasibility fixtures (fixtures/sources/) deliberately contain fake
# credentials whose only purpose is to prove the sanitizer removes them: every one
# carries the marker TELLTALEFAKE. They must stay in the raw fixtures, because a
# fixture without the probe cannot show the probe was removed. Allowlisted by the
# marker in the MATCH, never by path, so a real secret in the same file is still
# reported.
[[allowlists]]
description = "TELLTALEFAKE privacy probes in captured fixtures"
regexTarget = "match"
regexes = [
  '''TELLTALEFAKE''',
]

# Telltale's own identifiers, which are opaque local ids and not credentials: a capture
# (`cap_`), an imported capture (`imp_`), a series (`ser_`), a forecast run (`fc_`) and
# an environment fingerprint (`env_`). They are printed by `telltale sessions`, pasted
# throughout docs/log/ and written into every tracked experiment output.
#
# They are reported because a series cohort spells a dropped row as `{"key": ..., "reason":
# ...}` and generic-api-key matches a high-entropy value under a JSON member named `key`.
# Measured on 2026-09-03: 36 findings across experiments/E11/out/{series,summary}.json,
# every one a `cap_` or `imp_` id in that list.
#
# Allowlisted by the MATCH and never by path, which is the rule the TELLTALEFAKE entry
# above states: a real secret in the same file is still reported, and the day one of these
# files holds an Anthropic key this gate still goes red. The prefixes are Telltale's own
# and no provider credential format uses them, so this narrows the scan by exactly the set
# of strings this repository mints.
[[allowlists]]
description = "Telltale's own opaque ids (capture, import, series, forecast run, fingerprint)"
regexTarget = "match"
regexes = [
  '''"(cap|imp|ser|fc)_[0-9A-Za-z]{24,26}"''',
  '''"env_[0-9a-f]{64}"''',
]
