[project]
name = "e02-fixture"
version = "0.0.1"
description = "Throwaway repository the E02 capture scenarios run an agent against."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
